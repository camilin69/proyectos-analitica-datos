<div class="password-container">

  <div class="password-content">
    <div class="password-card">
      <div class="card-header">
        <h1>Sign in</h1>
        <p class="user-email">Welcome, {{ userEmail }}</p>
      </div>

      <div class="card-body">
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                formControlName="password"
                class="form-control"
                [class.invalid]="password?.invalid && password?.touched"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password"
                (click)="togglePasswordVisibility()"
              >
                <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
              </button>
            </div>
            <span *ngIf="password?.invalid && password?.touched" class="validation-error">
              <span *ngIf="password?.errors?.['required']">Password is required</span>
              <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
            </span>
          </div>

          <button
            type="submit"
            class="btn-primary"
            [disabled]="isLoading || passwordForm.invalid"
          >
            <span *ngIf="isLoading" class="loading-spinner"></span>
            {{ isLoading ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>

        <div class="password-options">
          <button class="btn-link" (click)="navigateBack()">
            Try another account
          </button>
          
          <button class="btn-text">
            Forgot password?
          </button>

          <div class="divider">
            <span>or</span>
          </div>

          <button class="btn-outline">
            Sign in via your organization
          </button>

          <button class="btn-text">
            Get help with access
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
