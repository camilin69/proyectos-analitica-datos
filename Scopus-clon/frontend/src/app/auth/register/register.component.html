<div class="register-container">
  <div class="register-header">
    <div class="scopus-logo">
      <h1>Scopus</h1>
    </div>
  </div>

  <div class="register-content">
    <div class="register-card">
      <div class="card-header">
        <h2>Welcome</h2>
        <p class="welcome-text">
          Enter your email to continue with <strong>Scopus</strong>
        </p>
        <p class="info-text">
          If you have an Elsevier account, you will be directed to Sign in.<br>
          If no account is found in our database, you will be asked to Register.
        </p>
      </div>

      <div class="card-body">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-control"
              [class.invalid]="email?.invalid && email?.touched"
              placeholder="Enter your email"
              autocomplete="email"
            />
            <span *ngIf="email?.invalid && email?.touched" class="validation-error">
              <span *ngIf="email?.errors?.['required']">Email is required</span>
              <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
            </span>
          </div>

          <button
            type="submit"
            class="btn-primary"
            [disabled]="isLoading || registerForm.invalid"
          >
            <span *ngIf="isLoading" class="loading-spinner"></span>
            {{ isLoading ? 'Continuing...' : 'Continue' }}
          </button>
        </form>

        <div class="register-footer">
          <p>Already have an account? <a routerLink="/auth/login">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
