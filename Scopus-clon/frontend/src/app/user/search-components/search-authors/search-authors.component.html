<div class="search-form-container">
  <div class="search-options">
    <div class="search-within">
      <div class="select-container">
        <select [(ngModel)]="searchWithin" class="form-select">
          <option *ngFor="let option of searchWithinOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
        <label class="floating-label">Search within authors</label>
      </div>
    </div>
  </div>

  <div class="search-input-group">
    <div class="search-field">
      <div class="input-container">
        <div class="input-with-clear">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder=" " 
            class="search-input"
            (keyup.enter)="onSearch()"
          >
          <label class="floating-label">Author name *</label>
          <button *ngIf="searchTerm" class="clear-btn" (click)="searchTerm = ''">
            <i class="material-icons">close</i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="search-actions">
  <button class="btn-secondary" (click)="addSearchField()">
    <img [src]="addIconUrl">
    Add author field
  </button>
  <button class="btn-secondary" (click)="addAffiliation()">
    <img [src]="affiliationIconUrl">
    Add affiliation
  </button>
  <a href="#" class="advanced-link">Advanced author search <img [src]="greaterThanIconUrl"></a>
  <div class="form-actions">
    <button class="btn-outline" (click)="onReset()">Reset</button>
    <button 
      class="btn-primary" 
      (click)="onSearch()"
      [disabled]="!searchTerm.trim()"
    >
      Search Authors
      <img [src]="searchIconUrl">
    </button>
  </div>
</div>
